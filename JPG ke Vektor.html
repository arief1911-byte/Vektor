<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JPG ke Vektor</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f7;--panel:#fff;--ink:#14213d;--mute:#5b6b85;--line:#c9d3e3;--acc:#e0245e;--acc-ink:#fff;--grid:#dbe3ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1830;--panel:#16223f;--ink:#e8eefc;--mute:#9bacca;--line:#2c3c63;--acc:#ff4f86;--acc-ink:#14061a;--grid:#1b2a4d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1830;--panel:#16223f;--ink:#e8eefc;--mute:#9bacca;--line:#2c3c63;--acc:#ff4f86;--acc-ink:#14061a;--grid:#1b2a4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 clamp(1.8rem,5vw,2.8rem)/1.1 Georgia,"Times New Roman",serif;margin:8px 0 6px;letter-spacing:-.02em}
p.lead{margin:0 0 20px;color:var(--mute);max-width:60ch}
.layout{display:grid;gap:16px;grid-template-columns:300px 1fr}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;padding:16px}
#drop{border:2px dashed var(--line);border-radius:6px;padding:18px;text-align:center;cursor:pointer;color:var(--mute)}
#drop.over,#drop:focus-visible{border-color:var(--acc);outline:none}
#drop strong{color:var(--ink);display:block}
label{display:block;font-size:.88rem;margin:14px 0 4px;font-weight:600}
label span{float:right;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums}
label.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:10px 0 0}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;padding:8px;border:1.5px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
button{font:inherit;font-weight:600;padding:11px 14px;border-radius:4px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;width:100%}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);margin-top:18px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.views{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.views{grid-template-columns:1fr}}
.view{background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;min-width:0}
.view h2{margin:0;padding:8px 12px;font-size:.9rem;border-bottom:1.5px solid var(--ink)}
.stage{aspect-ratio:1/1;overflow:auto;background:#fff}
.stage img{display:block;margin:auto;width:100%;height:100%;object-fit:contain}
.stage.z img{height:auto;object-fit:initial;margin:0}
.stage .ph{color:#5b6b85;font-size:.9rem;padding:20px;text-align:center}
#stats{margin:12px 0 0;color:var(--mute);font-size:.9rem;min-height:1.4em}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.err{color:var(--acc);font-weight:600}
.stage.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;align-content:start}
.stage.grid img{width:100%;height:auto;aspect-ratio:1/1;border:1px solid var(--line)}
input[type=number]{width:100%;padding:8px;border:1.5px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<main>
<h1>JPG ke vektor</h1>
<p class="lead">Ubah gambar JPG menjadi SVG dengan kurva halus yang tetap tajam di ukuran apa pun. Semua proses berjalan di browser Anda; gambar tidak diunggah ke mana pun.</p>
<div class="layout">
<section class="panel" aria-label="Pengaturan">
<div id="drop" tabindex="0" role="button" aria-label="Pilih gambar"><strong>Pilih atau seret gambar ke sini</strong>JPG, PNG, atau WebP</div>
<input id="file" type="file" accept="image/*" hidden>
<label for="preset">Jenis gambar</label>
<select id="preset">
<option value="ikon">Ikon / garis (hitam-putih)</option>
<option value="logo">Logo berwarna</option>
<option value="foto">Foto</option>
</select>
<label for="split">Isi gambar</label>
<select id="split">
<option value="one">Satu ikon / satu gambar</option>
<option value="auto">Beberapa ikon: pisahkan otomatis</option>
<option value="grid">Beberapa ikon: pisahkan per kotak (grid)</option>
</select>
<div id="autoBox" hidden><label for="count">Jumlah ikon di gambar</label><input id="count" type="number" min="2" max="100" value="16"></div>
<div id="gridBox" hidden><div class="two"><div><label for="cols">Kolom</label><input id="cols" type="number" min="1" max="20" value="4"></div><div><label for="rows">Baris</label><input id="rows" type="number" min="1" max="20" value="4"></div></div></div>
<label for="colors" id="colorsL">Jumlah warna <span id="colorsV"></span></label>
<input id="colors" type="range" min="2" max="32" value="6">
<label for="thick">Ketebalan garis <span id="thickV"></span></label>
<input id="thick" type="range" min="-80" max="80" value="-10">
<label for="blur">Haluskan sumber (derau JPG) <span id="blurV"></span></label>
<input id="blur" type="range" min="0" max="3" step="0.1" value="0.4">
<label for="smooth">Kehalusan kurva <span id="smoothV"></span></label>
<input id="smooth" type="range" min="0" max="12" value="4">
<label for="eps">Toleransi simpul <span id="epsV"></span></label>
<input id="eps" type="range" min="0.1" max="2" step="0.05" value="0.35">
<label for="minArea">Buang bintik kecil <span id="minAreaV"></span></label>
<input id="minArea" type="range" min="0" max="30" value="0">
<label class="chk"><input type="checkbox" id="corners" checked> Pertahankan sudut tajam</label>
<label class="chk" id="bgL"><input type="checkbox" id="bg"> Tambahkan latar putih</label>
<button class="primary" id="go" disabled>Ubah ke vektor</button>
</section>
<section>
<div class="views">
<div class="view"><h2>Asli</h2><div class="stage" id="s1"><div class="ph">Belum ada gambar</div></div></div>
<div class="view"><h2>Vektor (SVG)</h2><div class="stage" id="s2"><div class="ph">Hasil muncul di sini</div></div></div>
</div>
<label for="zoom">Zoom pratinjau <span id="zoomV"></span></label>
<input id="zoom" type="range" min="1" max="6" step="0.5" value="1">
<p id="stats" aria-live="polite"></p>
<div class="dl" id="dlOne">
<button id="dlSvg" disabled>Unduh SVG</button>
<button id="dlPng" disabled>Unduh PNG besar</button>
</div>
<div id="dlMulti" hidden>
<button id="dlZip" class="primary" style="margin-top:12px" disabled>Unduh ZIP</button>
<label class="chk"><input type="checkbox" id="zipPng" checked> Sertakan juga PNG di dalam ZIP</label>
</div>
<label for="pngsize" style="margin-top:12px">Lebar PNG ekspor <span id="pngsizeV"></span></label>
<input id="pngsize" type="range" min="1000" max="8000" step="500" value="4000">
</section>
</div>
</main>
<script>

 return out}

function otsu(v){var h=new Float64Array(256),i,n=v.length,sum=0,sB=0,wB=0,best=0,bt=128;

function contours(F,W,H,thr){

function loopToPath(pts,o,s){

function dilate(m,w,h){

 for(i=0;i<n;i+=Math.max(1,(n/20000)|0))smp.push(gray[i]);smp.sort(function(a,b){return a-b});
 var bg=smp[smp.length>>1],dv=smp.map(function(v){return Math.abs(v-bg)}).sort(function(a,b){return a-b}),thr=Math.max(25,dv[Math.floor(dv.length*0.99)]*0.35);

  var cols=Math.max(1,o.cols|0),rows=Math.max(1,o.rows|0),cw=dw/cols,ch=dh/rows,r,c;

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var img=null,svgText='',svgUrl='',imgUrl='',busy=false;
var P={ikon:{mode:'bw',thick:-10,blur:.4,smooth:4,eps:.35,minArea:0,colors:2},
 logo:{mode:'color',colors:6,thick:0,blur:.5,smooth:4,eps:.4,minArea:1},

var ids=['colors','thick','blur','smooth','eps','minArea','zoom','pngsize'];
function sync(){ids.forEach(function(i){var v=$(i).value;$(i+'V').textContent=i==='zoom'?v+'×':(i==='pngsize'?v+' px':v)});
 var bw=$('preset').value==='ikon';$('colors').style.display=$('colorsL').style.display=bw?'none':'';$('bgL').style.display=bw?'':'none';
 var z=+$('zoom').value;['s1','s2'].forEach(function(s){var st=$(s),im=st.querySelector('img');if(st.classList.contains('grid'))return;st.classList.toggle('z',z>1);if(im)im.style.width=z>1?(z*100)+'%':'100%'})}
ids.forEach(function(i){$(i).addEventListener('input',sync)});
$('preset').addEventListener('change',function(){var p=P[this.value];['colors','thick','blur','smooth','eps','minArea'].forEach(function(k){$(k).value=p[k]});sync()});
sync();
function msg(t,e){var s=$('stats');s.textContent=t;s.className=e?'err':''}
function load(f){
 if(!f||!/^image\//.test(f.type)){msg('Berkas bukan gambar. Pilih JPG, PNG, atau WebP.',1);return}
 if(imgUrl)URL.revokeObjectURL(imgUrl);imgUrl=URL.createObjectURL(f);
 var im=new Image();
 im.onload=function(){img=im;$('s1').innerHTML='';var o=new Image();o.src=imgUrl;o.alt='Gambar asli';$('s1').appendChild(o);sync();
  $('go').disabled=false;msg('Gambar dimuat: '+im.naturalWidth+' × '+im.naturalHeight+' px. Klik "Ubah ke vektor".')};
 im.onerror=function(){msg('Gambar tidak bisa dibaca. Coba berkas lain.',1)};
 im.src=imgUrl;
}
$('drop').addEventListener('click',function(){$('file').click()});
$('drop').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
$('file').addEventListener('change',function(){load(this.files[0])});
['dragenter','dragover'].forEach(function(t){$('drop').addEventListener(t,function(e){e.preventDefault();this.classList.add('over')})});
['dragleave','drop'].forEach(function(t){$('drop').addEventListener(t,function(e){e.preventDefault();this.classList.remove('over')})});
$('drop').addEventListener('drop',function(e){load(e.dataTransfer.files[0])});

function showMode(){var m=$('split').value;$('autoBox').hidden=m!=='auto';$('gridBox').hidden=m!=='grid'}
$('split').addEventListener('change',showMode);showMode();
var results=[],single=null;
function opts(){var p=$('preset').value;return{mode:p==='ikon'?'bw':'color',colors:+$('colors').value,thick:+$('thick').value,blur:+$('blur').value,smooth:+$('smooth').value,eps:+$('eps').value,minArea:+$('minArea').value,corners:$('corners').checked,bg:$('bg').checked}}
function pad2(n){return(n<10?'0':'')+n}
$('go').addEventListener('click',async function(){
 if(!img||busy)return;busy=true;var btn=this;btn.disabled=true;btn.textContent='Memproses…';msg('Sedang melacak bentuk, mohon tunggu.');
 ['dlSvg','dlPng','dlZip'].forEach(function(i){$(i).disabled=true});
 try{
  var k=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));

  var o=opts(),mode=$('split').value;
  if(mode==='one'){
   var r=await VT.convert(cx.getImageData(0,0,w,h).data,w,h,o,function(i,n){msg('Melacak lapisan warna '+i+' dari '+n+'…')});
   single=r.svg;results=[];if(svgUrl)URL.revokeObjectURL(svgUrl);
   svgUrl=URL.createObjectURL(new Blob([single],{type:'image/svg+xml'}));
   var st=$('s2');st.className='stage';st.innerHTML='';var o2=new Image();o2.src=svgUrl;o2.alt='Hasil vektor';st.appendChild(o2);
   $('dlOne').hidden=false;$('dlMulti').hidden=true;sync();
   msg('Selesai: '+r.paths.toLocaleString('id-ID')+' bentuk, '+(single.length/1024).toFixed(0)+' KB, dilacak pada skala '+r.scale+'×. Geser zoom untuk memeriksa kehalusan.');

  }else{
   var all=cx.getImageData(0,0,w,h).data,det=VT.detect(all,w,h,{mode:mode,count:+$('count').value,cols:+$('cols').value,rows:+$('rows').value});

   var ov=document.createElement('canvas'),sc=Math.min(1,1200/Math.max(w,h));ov.width=Math.round(w*sc);ov.height=Math.round(h*sc);var oc=ov.getContext('2d');oc.drawImage(cv,0,0,ov.width,ov.height);
   oc.lineWidth=2;oc.strokeStyle='#e0245e';oc.fillStyle='#e0245e';oc.font='bold 14px sans-serif';
   det.boxes.forEach(function(b,i){oc.strokeRect(b.x*sc,b.y*sc,b.w*sc,b.h*sc);oc.fillText(String(i+1),b.x*sc+4,b.y*sc+16)});
   var im1=$('s1').querySelector('img');if(im1)im1.src=ov.toDataURL('image/png');
   results.forEach(function(x){URL.revokeObjectURL(x.url)});results=[];
   var st2=$('s2');st2.className='stage grid';st2.innerHTML='';
   for(var i=0;i<det.boxes.length;i++){
    msg('Mengubah ikon '+(i+1)+' dari '+det.boxes.length+'…');await new Promise(function(r){setTimeout(r,0)});
    var b=det.boxes[i],rr=await VT.convert(cx.getImageData(b.x,b.y,b.w,b.h).data,b.w,b.h,o);
    var u=URL.createObjectURL(new Blob([rr.svg],{type:'image/svg+xml'}));results.push({svg:rr.svg,url:u,w:b.w,h:b.h});
    var t2=new Image();t2.src=u;t2.alt='Ikon '+(i+1);st2.appendChild(t2)}
   $('dlOne').hidden=true;$('dlMulti').hidden=false;$('dlZip').textContent='Unduh ZIP ('+results.length+' ikon)';$('dlZip').disabled=false;
   msg((mode==='auto'&&!det.exact?'Ditemukan '+det.found+' ikon, bukan '+$('count').value+'. Ubah jumlah ikon atau pakai mode grid. ':'Selesai: '+results.length+' ikon terpisah. ')+'Cek kotak merah di gambar asli, lalu unduh ZIP.');
  }

});
async function saveFile(name,blob){

 var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}

$('dlSvg').addEventListener('click',function(){if(single)saveFile('vektor.svg',new Blob([single],{type:'image/svg+xml'}))});

 try{saveFile('vektor-'+W+'px.png',await rasterize(svgUrl,W,H))}catch(e){msg('Ukuran PNG terlalu besar untuk perangkat ini. Turunkan lebarnya.',1)}});
$('dlZip').addEventListener('click',async function(){
 if(!results.length||busy)return;busy=true;var btn=this;btn.disabled=true;var files=[],enc=new TextEncoder(),wantPng=$('zipPng').checked,W=+$('pngsize').value;
 try{for(var i=0;i<results.length;i++){var r=results[i],nm='ikon-'+pad2(i+1);msg('Menyusun ZIP: '+(i+1)+' dari '+results.length+'…');
   files.push({name:nm+'.svg',data:enc.encode(r.svg)});
   if(wantPng){var b=await rasterize(r.url,W,Math.round(W*r.h/r.w));files.push({name:nm+'.png',data:new Uint8Array(await b.arrayBuffer())})}}
  await saveFile('ikon-vektor.zip',VT.zip(files));msg('ZIP siap: '+results.length+' ikon'+(wantPng?' (SVG dan PNG)':' (SVG)')+'.')

})();
